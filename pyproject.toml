[project]
name = "modern-ir-bench"
version = "0.1.0"
description = "A code-native benchmark for modern information retrieval solutions"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "datasets>=4.0,<5",
    "huggingface-hub>=0.30",
    "jieba>=0.42,<1",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "pymilvus[milvus-lite]>=3.0,<3.1",
]

[dependency-groups]
benchmark = [
    "FlagEmbedding>=1.3,<2",
    "requests>=2.32,<3",
    "sentence-transformers>=6.1,<7",
    "torch>=2.8,<2.9",
    "transformers>=5.19,<6",
    "voyageai>=0.3,<1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.12,<1",
]
pdf = [
    "chardet<6",
    "paddleocr>=3.3,<4",
    "pypdfium2>=4.30,<6",
]
multimodal = [
    "qwen-vl-utils[decord]>=0.0.14,<0.1",
    "torchvision>=0.23,<0.24",
]
pdf-cpu = [
    "paddlepaddle==3.2.2",
]
pdf-gpu = [
    "paddlepaddle-gpu==3.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modern_ir_bench"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [".*", "build", "dist", "results", "legacy"]

[tool.uv]
conflicts = [
    [{ group = "benchmark" }, { group = "pdf-gpu" }],
    [{ group = "multimodal" }, { group = "pdf-gpu" }],
    [{ group = "pdf-cpu" }, { group = "pdf-gpu" }],
]

[[tool.uv.index]]
name = "torch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "paddle-cu126"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true

[tool.uv.sources]
torch = [
    { index = "torch-cu128", group = "benchmark", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchvision = [
    { index = "torch-cu128", group = "multimodal", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
paddlepaddle-gpu = { index = "paddle-cu126", group = "pdf-gpu" }
