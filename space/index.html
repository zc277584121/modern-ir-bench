<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Code-native evaluation for modern information retrieval solutions"
    />
    <title>Modern IR Bench</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="profile.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header">
        <h1>Modern IR Bench</h1>
        <nav class="header-links" aria-label="Project links">
          <a href="https://github.com/zc277584121/modern-ir-bench" target="_blank" rel="noreferrer">GitHub ↗</a>
        </nav>
      </header>
      <div id="error-notice" class="notice" aria-live="polite" hidden></div>

      <section id="evaluation-context" class="evaluation-context" aria-label="Evaluation context">
        <div class="evaluation-controls">
          <div class="control-group task-controls">
            <div id="task-control" class="control">
              <label for="task-selector">Task</label>
              <select id="task-selector"></select>
            </div>
            <div id="dataset-control" class="control">
              <label for="dataset-selector">
                <span>Dataset</span>
                <span id="dataset-release" class="control-meta"></span>
              </label>
              <select id="dataset-selector"></select>
            </div>
            <div id="solution-tag-control" class="control">
              <label for="solution-tag-selector">Solution tag</label>
              <select id="solution-tag-selector"></select>
            </div>
          </div>
          <div class="control-group breakdown-controls">
            <div class="control">
              <label for="breakdown-selector">Analyze by</label>
              <select id="breakdown-selector"></select>
            </div>
            <div id="breakdown-value-control" class="control" hidden>
              <label id="breakdown-value-label" for="breakdown-value-selector">Value</label>
              <select id="breakdown-value-selector"></select>
            </div>
          </div>
        </div>
        <p id="breakdown-note" class="breakdown-note" hidden></p>
      </section>

      <section class="leaderboard-panel">
        <div id="leaderboard-table"></div>

        <section id="profile-section" class="profile-section" aria-labelledby="profile-title">
          <div class="profile-header">
            <div>
              <h3 id="profile-title">Performance by group</h3>
              <p id="profile-description"></p>
            </div>
          </div>
          <details class="solution-picker">
            <summary id="profile-solution-summary">Solutions</summary>
            <div id="profile-solution-options" class="solution-options"></div>
          </details>
          <p id="profile-note" class="breakdown-note"></p>
          <div id="profile-chart" class="profile-chart" aria-live="polite"></div>
          <div id="profile-legend" class="profile-legend"></div>
        </section>
      </section>
    </main>
    <div id="solution-preview" class="solution-preview" role="tooltip" hidden></div>
    <script src="app.js" type="module"></script>
  </body>
</html>
